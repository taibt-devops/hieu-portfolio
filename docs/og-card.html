<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@500;600&family=IBM+Plex+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#0A0A0A;font-family:"Be Vietnam Pro",sans-serif}
.bg{position:absolute;inset:0;background:url(images/moment-crowd.jpg) center 30%/cover;}
.scrim{position:absolute;inset:0;background:linear-gradient(100deg,rgba(10,10,10,.95) 0%,rgba(10,10,10,.78) 42%,rgba(10,10,10,.25) 75%,rgba(10,10,10,.45) 100%)}
.in{position:absolute;inset:0;padding:70px 80px;display:flex;flex-direction:column;justify-content:center}
.km{display:inline-flex;align-items:center;gap:14px;font:700 20px "IBM Plex Mono",monospace;letter-spacing:.18em;color:#bbb}
.km b{background:#C8FF00;color:#0A0A0A;padding:4px 14px}
h1{font:400 128px/1.26 Anton,sans-serif;color:#F5F5F5;letter-spacing:.01em;margin:18px 0 6px;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.roles{font:700 26px "IBM Plex Mono",monospace;letter-spacing:.3em;color:#C8FF00}
.sub{margin-top:18px;font-size:24px;color:#ddd;font-weight:500}
</style></head><body>
<div class="bg"></div><div class="scrim"></div>
<div class="in">
  <p class="km"><b>KM 00</b> MC ĐÁM CƯỚI &amp; SỰ KIỆN</p>
  <h1>THANH HIẾU</h1>
  <p class="roles">MC SONG NGỮ · SPEAKER</p>
  <p class="sub">Người truyền động lực — trên sân khấu &amp; trên đường chạy.</p>
</div>
</body></html>
