<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh Hiếu — MC · Speaker · Runner</title>
  <meta name="description" content="Thanh Hiếu — MC sự kiện, diễn giả truyền động lực. Năng lượng tích cực từ sân khấu đến đường chạy: chạy bộ, bơi lội, pickleball.">
  <meta property="og:title" content="Thanh Hiếu — MC · Speaker · Runner">
  <meta property="og:description" content="Người truyền động lực trên sân khấu và trên đường chạy.">
  <meta property="og:image" content="images/hero.jpg">
  <meta property="og:type" content="profile">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="#home" data-i18n="logo">TH.</a>
    <nav class="site-nav" aria-label="Menu">
      <a href="#about" data-i18n="nav.about">Câu chuyện</a>
      <a href="#passions" data-i18n="nav.passions">Đam mê</a>
      <a href="#gallery" data-i18n="nav.gallery">Khoảnh khắc</a>
      <a href="#services" data-i18n="nav.services">Dịch vụ</a>
      <a class="nav-cta" href="#contact" data-i18n="nav.contact">Booking</a>
    </nav>
    <div class="lang-switch" role="group" aria-label="Ngôn ngữ / Language">
      <button class="lang-btn is-active" data-lang="vi" type="button">VI</button>
      <button class="lang-btn" data-lang="en" type="button">EN</button>
    </div>
  </header>

  <main>

    <!-- KM 00 · HERO -->
    <section class="hero" id="home">
      <img class="hero-img" src="images/hero.jpg" alt="Thanh Hiếu trên đường chạy" data-fallback="images/hero.jpg">
      <div class="hero-overlay" aria-hidden="true"></div>
      <div class="hero-content">
        <p class="km-marker"><span class="km-num">KM 00</span><span class="km-label" data-i18n="hero.km">VẠCH XUẤT PHÁT</span></p>
        <h1 class="hero-name">THANH<br>HIẾU</h1>
        <p class="hero-roles">MC <span class="dot">·</span> SPEAKER <span class="dot">·</span> RUNNER</p>
        <p class="hero-sub" data-i18n="hero.sub">Người truyền động lực — trên sân khấu &amp; trên đường chạy.</p>
      </div>
      <a class="scroll-cue" href="#about" aria-label="Cuộn xuống">
        <span class="scroll-cue-line" aria-hidden="true"></span>
        <span data-i18n="hero.scroll">CUỘN XUỐNG</span>
      </a>
    </section>

    <!-- MARQUEE -->
    <div class="marquee" aria-hidden="true">
      <div class="marquee-track">
        <span class="marquee-group">
          <span data-i18n="marquee.1">TRUYỀN LỬA</span><i>★</i>
          <span>KEEP MOVING</span><i>★</i>
          <span data-i18n="marquee.2">NĂNG LƯỢNG TÍCH CỰC</span><i>★</i>
          <span>NEVER STOP</span><i>★</i>
        </span>
        <span class="marquee-group">
          <span data-i18n="marquee.1">TRUYỀN LỬA</span><i>★</i>
          <span>KEEP MOVING</span><i>★</i>
          <span data-i18n="marquee.2">NĂNG LƯỢNG TÍCH CỰC</span><i>★</i>
          <span>NEVER STOP</span><i>★</i>
        </span>
      </div>
    </div>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
